<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flow Reference Studio</title>
  <style>
    :root {
      --bg: #070a11;
      --bg-elev: #0f1624;
      --bg-card: #151e30;
      --bg-card-hover: #1c2840;
      --bg-input: #090d16;
      --border: #22304a;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #8b9bb4;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft: rgba(99, 102, 241, 0.16);
      --ok: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      font: 13px/1.5 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(500px 260px at 15% -10%, rgba(99, 102, 241, 0.16), transparent 70%),
        radial-gradient(400px 220px at 90% 0%, rgba(236, 72, 153, 0.09), transparent 70%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-font-smoothing: antialiased;
    }
    .sp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .sp-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sp-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 12.5px;
      color: #fff;
      box-shadow: 0 3px 12px rgba(99, 102, 241, 0.4);
      flex-shrink: 0;
    }
    .sp-brand h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .sp-brand p {
      margin: 1px 0 0;
      font-size: 11px;
      color: var(--text-muted);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
      white-space: nowrap;
    }
    .badge.ok {
      background: rgba(16, 185, 129, 0.14);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.38);
    }
    .badge.warn {
      background: rgba(245, 158, 11, 0.14);
      color: #fcd34d;
      border-color: rgba(245, 158, 11, 0.38);
    }
    .badge.danger {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.38);
    }
    .card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 13px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .wallet-card {
      background: linear-gradient(145deg, rgba(22, 31, 52, 0.96), rgba(15, 21, 36, 0.96));
      border-color: rgba(99, 102, 241, 0.42);
    }
    .card-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .wallet-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .wallet-input {
      flex: 1;
      min-width: 0;
      padding: 7px 10px;
      font-size: 16px;
      font-weight: 800;
      color: #fef08a;
      background: var(--bg-input);
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: var(--radius-sm);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.28);
    }
    .wallet-input:focus {
      outline: none;
      border-color: #fbbf24;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
    }
    .quick-chips {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .chip-btn {
      flex: 1;
      padding: 4px 6px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .chip-btn:hover {
      border-color: #4f46e5;
      color: #fff;
      background: var(--accent-soft);
    }
    .cta-primary {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 14px;
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 60%, #7c3aed 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cta-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.55);
    }
    .cta-secondary {
      width: 100%;
      margin-top: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .cta-secondary:hover {
      color: #fff;
      background: var(--bg-card-hover);
      border-color: #384d75;
    }
    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tool-tile {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 9px 10px;
      border-radius: 9px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .tool-tile:hover {
      background: var(--bg-card-hover);
      border-color: rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }
    .tool-tile strong {
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tool-tile span {
      font-size: 10.5px;
      color: var(--text-muted);
    }
    .sp-footer {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .icon-btn:hover { color: #fff; border-color: #475f8c; }
  </style>
</head>
<body>
  <header class="sp-header">
    <div class="sp-brand">
      <div class="sp-logo">FRS</div>
      <div>
        <h1>Flow Reference Studio</h1>
        <p>Local-First Creative Suite</p>
      </div>
    </div>
    <span id="sp-bridge" class="badge">Kiểm tra...</span>
  </header>

  <section class="card wallet-card">
    <div class="card-label">
      <span>💎 Số dư Token Flow</span>
      <span id="sp-wallet-hint" style="font-weight:500; text-transform:none; color:var(--text-muted);">Đồng bộ tự động</span>
    </div>
    <div class="wallet-row">
      <input id="sp-balance" class="wallet-input" type="number" min="0" step="1" placeholder="Nhập token hiện có..." />
      <span style="font-size:12px; font-weight:700; color:#fbbf24;">token</span>
    </div>
    <div class="quick-chips">
      <button type="button" class="chip-btn" data-add="10">+10</button>
      <button type="button" class="chip-btn" data-add="50">+50</button>
      <button type="button" class="chip-btn" data-add="100">+100</button>
      <button type="button" class="chip-btn" id="sp-bal-clear">Xóa</button>
    </div>
  </section>

  <section class="card">
    <button id="open" class="cta-primary" type="button">Mở Studio Workbench</button>
    <button id="open-flow" class="cta-secondary" type="button">Mở trang Google Flow ↗</button>
  </section>

  <section class="card">
    <div class="card-label" style="color:var(--text-secondary);">
      <span>Mở nhanh Công cụ</span>
      <button id="sp-refresh" class="icon-btn" type="button" title="Kiểm tra lại kết nối Bridge">⟳ Kiểm tra</button>
    </div>
    <div class="tool-grid">
      <button type="button" class="tool-tile" data-target="tab-studio">
        <strong>🎨 Phối ảnh</strong>
        <span>Multi-Ref • 1 token/ảnh</span>
      </button>
      <button type="button" class="tool-tile" data-target="tab-strict">
        <strong>🖌️ Sửa vùng</strong>
        <span>Inpaint pixel-verified</span>
      </button>
      <button type="button" class="tool-tile" data-target="tab-asset">
        <strong>🎮 Game Asset</strong>
        <span>Sprite tách nền tự động</span>
      </button>
      <button type="button" class="tool-tile" data-target="tab-room">
        <strong>🏠 BG Room</strong>
        <span>Isometric → Illust 2D</span>
      </button>
      <button type="button" class="tool-tile" data-target="tab-anim">
        <strong>🎞️ Animation</strong>
        <span>Seamless Loop • 20 token</span>
      </button>
      <button type="button" class="tool-tile" data-target="tab-video">
        <strong>🎬 Tạo Video</strong>
        <span>Omni Flash + TTS &amp; SRT</span>
      </button>
    </div>
  </section>

  <footer class="sp-footer">
    <div class="status-row">
      <span class="badge ok" style="font-size:10px; padding:1px 7px;">Assisted • Local-First</span>
      <span id="status"></span>
    </div>
    <span>Mẹo: Nhập số token đang hiển thị trên Google Flow vào ô trên để Workbench cảnh báo trước mỗi lượt tạo.</span>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
